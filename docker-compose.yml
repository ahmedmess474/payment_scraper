services:
  payment-scraper:
    build: .
    image: payment-scraper:latest
    container_name: payment-scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides whatever's in .env: the container has no display, so this
      # must run headless regardless of what a local dev's .env says.
      PUPPETEER_HEADLESS: "true"
      # Overrides .env's PORT too: that value is reused below to pick the
      # *host* port, but the app inside the container must stay on 3000 to
      # match EXPOSE and the healthcheck. Change the port this is reachable
      # on from the host by editing .env's PORT, not this line.
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Read-only: the app only ever reads this cookie export, never writes it.
      - ./secrets:/home/pptruser/app/secrets:ro
      # Scraped statements, filtered transfers, and run logs land here.
      - ./data:/home/pptruser/app/data
      # Persists Chrome's profile (cookies/session/reCAPTCHA trust) across
      # container recreations, same role it plays outside Docker.
      - puppeteer-profile:/home/pptruser/app/.puppeteer-profile
    # Chrome's shared-memory use overruns Docker's default 64MB /dev/shm;
    # this is the other half of the --disable-dev-shm-usage flag in code.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  puppeteer-profile:
