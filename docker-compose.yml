services:
  payment-scraper:
    build: .
    image: payment-scraper:latest
    container_name: payment-scraper
    restart: unless-stopped
    # Runs as the host's own uid:gid instead of the image's built-in
    # "pptruser" (whose uid isn't 1000 in every image tag) — this is what
    # actually makes the bind-mounted ./secrets and ./data writable, since
    # bind mounts keep the host's ownership, not the container user's name.
    # Override APP_UID/APP_GID in .env if your deploy user isn't 1000:1000
    # (check with `id -u` / `id -g` on the host).
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - .env
    environment:
      # Overrides whatever's in .env: the container has no display, so this
      # must run headless regardless of what a local dev's .env says.
      PUPPETEER_HEADLESS: "true"
    # Shares the host's network namespace directly instead of Docker's usual
    # bridge network. Needed for PROXY_SERVER=socks5://127.0.0.1:<port> to
    # reach an SSH -R reverse tunnel (see README/deploy notes) — that tunnel
    # is deliberately bound to the host's loopback only, for security, and a
    # bridge-networked container's "localhost" is the container itself, not
    # the host, so it can never see a loopback-only service no matter how
    # it's addressed (host.docker.internal included — that still arrives via
    # the bridge interface, which a loopback-bound listener never accepts).
    # With host networking there's no separate internal/external port to
    # reconcile: the app binds directly to whatever PORT is set to in .env,
    # and `ports:` is meaningless here (and invalid to combine with this).
    network_mode: host
    volumes:
      # Read-write: /session-cookies writes a fresh export here at runtime,
      # loadSessionCookies() reads it back on every scrape.
      - ./secrets:/home/pptruser/app/secrets
      # Scraped statements, filtered transfers, and run logs land here.
      - ./data:/home/pptruser/app/data
      # Persists Chrome's profile (cookies/session/reCAPTCHA trust) across
      # container recreations, same role it plays outside Docker.
      - puppeteer-profile:/home/pptruser/app/.puppeteer-profile
    # Chrome's shared-memory use overruns Docker's default 64MB /dev/shm;
    # this is the other half of the --disable-dev-shm-usage flag in code.
    shm_size: "1gb"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get(`http://localhost:$${process.env.PORT || 3000}/health`, r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  puppeteer-profile:
